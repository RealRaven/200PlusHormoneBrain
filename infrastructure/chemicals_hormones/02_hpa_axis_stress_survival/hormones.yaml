- id: crh
  name: Corticotropin-Releasing Hormone
  type: neuropeptide
  aliases: [corticoliberin, crf, corticotropin_releasing_factor]
  half_life_minutes: 4
  response_time_minutes: 1
  units: pg/mL
  reference_range: [5, 40]
  released_by: [hypothalamus_pvn]
  acts_on: [pituitary_anterior]
  interacts_with:
    cortisol: "negative feedback — cortisol suppresses CRH release"
    acth: "stimulates ACTH release"
  baseline_level: 0.4
  diurnal: true
  tags: [stress, primary]

